name: Probe site fetch

on:
  schedule:
    # каждые 2 часа, на 17-й минуте (вне часа пик GitHub Actions)
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tests
        run: |
          for url in "https://lot44.ru/" "https://lot44.ru/heritage.html" "https://lot44.ru/analytics.html" "https://lot44.ru/legislation.html" "https://alexeinic-cyber.github.io/lot44/" "https://alexeinic-cyber.github.io/lot44/heritage.html"; do
            echo "=== $url ==="
            curl -sS -o /tmp/out.html --max-time 50 -w "code=%{http_code} size=%{size_download} time=%{time_total}s speed=%{speed_download}B/s\n" "$url" || echo "curl failed rc=$?"
            wc -c /tmp/out.html 2>/dev/null || true
            head -c 300 /tmp/out.html 2>/dev/null | tr -d '\n' | head -c 200 || true
            echo ""
          done
