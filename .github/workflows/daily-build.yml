# ЛОТ 44 — ежедневная пересборка и деплой на Netlify
# Расписание: 05:00 UTC = 08:00 МСК
# Дополнительно: запускается сразу после обновления data/torgi.json (данные готовит домашний ПК)

name: Daily build & deploy

on:
  schedule:
    # 05:00 UTC → 08:00 Москва (UTC+3)
    - cron: "0 5 * * *"
  workflow_dispatch:  # ручной запуск из вкладки Actions
  push:
    branches: [main]
    paths:
      - "data/torgi.json"

permissions:
  contents: write

concurrency:
  group: lot44-build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        id: build
        run: |
          set -euo pipefail
          python scripts/build.py | tee build.log
          if grep -q "STATUS: OK" build.log; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Данные не получены (API недоступен из CI и кэш пуст) — пропускаю коммит и деплой"
          fi
          test -f site/index.html

      - name: Commit updated data (cache)
        if: steps.build.outputs.has_data == 'true'
        run: |
          git config user.name "lot44-bot"
          git config user.email "lot44-bot@users.noreply.github.com"
          git add data/ site/ || true
          git diff --staged --quiet || git commit -m "chore: daily rebuild $(date -u +%Y-%m-%d)"
          git push || true

      - name: Deploy to Netlify
        if: steps.build.outputs.has_data == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY secrets not set — skip deploy (site built in site/)"
            exit 0
          fi
          python - <<'PYEOF'
          import io, json, os, ssl, sys, time, zipfile, urllib.request, urllib.error

          API = 'https://api.netlify.com/api/v1'
          token = os.environ['NETLIFY_AUTH_TOKEN']
          site_id = os.environ['NETLIFY_SITE_ID']
          ctx = ssl._create_unverified_context()

          def api(method, url, data=None, ctype=None, timeout=120):
              headers = {'User-Agent': 'lot44-ci', 'Authorization': 'Bearer ' + token}
              if ctype:
                  headers['Content-Type'] = ctype
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', 'replace')[:400]
                  print('HTTP %s on %s %s' % (e.code, method, url))
                  print('body:', body)
                  raise

          try:
              _, b = api('GET', API + '/user')
              u = json.loads(b)
              print('token account:', u.get('email') or u.get('id'))
          except Exception as e:
              print('WARN: /user недоступен:', e)
          try:
              _, b = api('GET', API + '/sites/' + site_id)
              s = json.loads(b)
              print('site:', s.get('name'), '| state:', s.get('state'), '| url:', s.get('ssl_url'))
          except Exception as e:
              print('WARN: /sites/%s недоступен:' % site_id, e)

          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('site'):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, arcname=os.path.relpath(p, 'site'))
          zip_bytes = buf.getvalue()
          print('zip: %.0f KB' % (len(zip_bytes) / 1024))

          dep = None
          for attempt in range(1, 4):
              try:
                  _, b = api('POST', API + '/sites/' + site_id + '/deploys', zip_bytes, 'application/zip')
                  dep = json.loads(b)
                  break
              except Exception as e:
                  print('deploy attempt %d failed: %s' % (attempt, e))
                  time.sleep(5 * attempt)
          if not dep:
              sys.exit('deploy create failed')
          dep_id = dep['id']
          print('deploy id:', dep_id)
          for _ in range(45):
              time.sleep(4)
              _, b = api('GET', API + '/deploys/' + dep_id)
              st = json.loads(b).get('state')
              print('состояние:', st)
              if st == 'ready':
                  print('OK: сайт обновлён')
                  sys.exit(0)
              if st in ('error', 'failed'):
                  sys.exit('deploy failed: ' + st)
          sys.exit('timeout waiting deploy')
          PYEOF
